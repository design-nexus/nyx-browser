name: Bug Report
description: File a bug report for Nyx Browser
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a bug report.

        > [!IMPORTANT]
        > - Use a descriptive title.
        > - Search existing issues first to avoid duplicates.
        > - Feature requests belong in a separate issue or discussion, not this template.
        > - Describe what happened, what you expected, and steps to reproduce.
  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This is a bug report, not a feature request.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so the issue can be reproduced.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and videos
      description: Optional. Attach anything that helps explain the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Help → About Browser (not “latest”).
      placeholder: 1.24.2b-2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Linux (NyxOS / package)
        - Linux (installer / tarball)
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Tabs / layouts
        - Sidebar
        - Address bar
        - Settings
        - Library / Extensions
        - Site styles / Scripts
        - Shield / Blocking
        - VPN
        - Passwords
        - Share / Capture / Assistant
        - Theme / Appearance
        - New tab
        - Performance
        - Privacy / Security
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Optional. Pasted as a code block automatically.
      render: shell
