<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<button id="customize" class="icon-button" type="button" title="Customize this page" aria-label="Customize this page" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></button>
<div id="options" hidden>
  <label><input type="checkbox" id="show-favorites"> Favorite sites</label>
  <label><input type="checkbox" id="show-recent"> Recent</label>
  <label><input type="checkbox" id="show-weather"> Weather</label>
</div>
<main>
  <form id="search" role="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 16.5L21 21M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
    <input id="query" type="search" placeholder="Search or enter address" aria-label="Search or enter address" autocomplete="off" autofocus>
  </form>
  <section id="favorites" aria-label="Favorite sites"></section>
  <div id="lower">
    <section id="recent-box" aria-labelledby="recent-title">
      <h2 class="group" id="recent-title">Recent</h2>
      <div id="recent"></div>
    </section>
    <section id="weather" aria-label="Weather" hidden>
      <h2 class="card-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>Weather</h2>
      <p id="weather-now"></p>
      <p id="weather-details"></p>
    </section>
  </div>
</main>
<script src="theme.js"></script>
<script src="newtab.js"></script>
</body>
</html>
