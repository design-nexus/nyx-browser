<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 10h16"/></svg></div>
  <form id="search" role="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 16.5L21 21M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
    <input id="query" type="search" placeholder="Search or enter an address" aria-label="Search or enter an address" autocomplete="off" autofocus>
    <kbd>Ctrl+L</kbd>
  </form>
  <div id="sections"></div>
</main>

<section id="weather" aria-label="Weather" hidden>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>
  <span id="weather-now"></span>
</section>

<button id="customize" type="button" aria-expanded="false" aria-controls="options">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg>Customize
</button>
<div id="options" role="dialog" aria-label="Customize this page" hidden>
  <h2 class="group">Sections</h2>
  <ol id="section-list"></ol>
  <h2 class="group">Background</h2>
  <div id="backgrounds" role="radiogroup" aria-label="Background">
    <label><input type="radio" name="background" value="none"> None</label>
    <label><input type="radio" name="background" value="glow"> Accent glow</label>
    <label><input type="radio" name="background" value="image"> Picture…</label>
  </div>
  <input id="picture" type="file" accept="image/*" hidden>
  <label class="check"><input type="checkbox" id="show-weather"> Weather</label>
</div>

<dialog id="favorite-dialog" aria-labelledby="favorite-heading">
  <form id="favorite-form" method="dialog" novalidate>
    <h2 id="favorite-heading">Add a favorite</h2>
    <div class="favorite-preview" aria-hidden="true">
      <span class="site-icon" id="favorite-preview-icon">?</span>
      <span class="favorite-preview-text">
        <span id="favorite-preview-name">New favorite</span>
        <span id="favorite-preview-host">Its address shows here</span>
      </span>
    </div>
    <label class="field">
      <span class="field-label">Address</span>
      <input name="url" type="text" placeholder="example.com" autocomplete="off" spellcheck="false" aria-describedby="favorite-error">
      <span class="field-error" id="favorite-error" role="alert" hidden>Enter a web address, like example.com.</span>
    </label>
    <label class="field">
      <span class="field-label">Name <span class="field-optional">Optional</span></span>
      <input name="title" type="text" autocomplete="off">
    </label>
    <div class="dialog-buttons">
      <button type="button" class="button" value="cancel" id="favorite-cancel">Cancel</button>
      <button type="submit" class="button primary" id="favorite-submit">Add</button>
    </div>
  </form>
</dialog>

<script src="theme.js"></script>
<script src="newtab.js"></script>
</body>
</html>
