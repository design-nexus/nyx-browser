<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<!-- The sidebar's header names the panel; this says where its answers come from. -->
<header>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg>
  <small>Answers come from Assistant on this computer</small>
</header>
<main id="conversation" aria-live="polite"></main>
<section id="permission" class="card" hidden>
  <h2>Read this page?</h2>
  <p>Assistant needs the text of <b id="permission-page"></b> to answer. It stays on this computer. Instructions written on a page are treated as page text, never as commands.</p>
  <div class="actions">
    <button id="deny" class="button" type="button">Not now</button>
    <button id="allow" class="button primary" type="button">Allow once</button>
  </div>
</section>
<form id="ask">
  <input id="question" type="text" placeholder="Ask about this page" aria-label="Ask about this page" autocomplete="off" maxlength="3000">
  <button class="icon-button" type="submit" title="Send (Enter)" aria-label="Send"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</form>
<script src="theme.js"></script>
<script src="panel.js"></script>
</body>
</html>
