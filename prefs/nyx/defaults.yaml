# Zen and Firefox defaults that Browser changes. tools/ffprefs reads this folder last, so
# each entry here replaces the one Zen defines.

# The address bar has its own row, with the buttons beside it.
- name: zen.view.use-single-toolbar
  value: false

- name: zen.view.experimental-no-window-controls
  value: true

- name: zen.theme.content-element-separation
  value: 8

- name: zen.theme.border-radius
  value: 11

- name: zen.theme.hide-unified-extensions-button
  value: false

- name: zen.view.overflow-webext-toolbar
  value: false

- name: zen.welcome-screen.seen
  value: true

- name: zen.watermark.enabled
  value: false

# Firefox's downloads panel; Zen's Library doesn't follow the Nyx theme.
- name: zen.library.enabled
  value: false

- name: browser.download.autohideButton
  value: false

# Ctrl+T opens the new tab page instead of Zen's address bar.
- name: zen.urlbar.replace-newtab
  value: false

- name: zen.updates.show-update-notification
  value: false

- name: browser.shell.checkDefaultBrowser
  value: false

- name: browser.shareqrcode.enabled
  value: true

# New tab sits at the end of the day's tabs.
- name: zen.view.show-newtab-button-top
  value: false

# A page that isn't secure says so in words in the address field.
- name: security.insecure_connection_text.enabled
  value: true

# The Nyx extension is part of Browser, so Firefox doesn't ask whether to keep the new tab page
# it gives (ExtensionControlledPopup skips distribution add-ons).
- name: extensions.installedDistroAddon.nyx-integration@design-nexus.github.io
  value: true

# The address field keeps Firefox's identity box (the lock, or "Not secure"), as the mockups
# have it, rather than the newer trust panel's icon.
- name: browser.urlbar.trustPanel.featureGate
  value: false

# Capture takes the screenshots (the Capture button and the page's menu), so Firefox's own is off.
- name: screenshots.browser.component.enabled
  value: false

# Bookmarks open in a new tab, as Vivaldi has them.
- name: browser.tabs.loadBookmarksInTabs
  value: true

# Settings › Tabs & Sidebar names the choice for links from other apps; -1 would follow
# browser.link.open_newwindow, which is a new tab too.
- name: browser.link.open_newwindow.override.external
  value: 3

# Passwords come from Nyx Passwords, built in; Firefox's own saving and filling are off, and so
# are its cards and addresses.
- name: signon.rememberSignons
  value: false

- name: signon.autofillForms
  value: false

- name: signon.generation.enabled
  value: false

- name: extensions.formautofill.addresses.enabled
  value: false

- name: extensions.formautofill.creditCards.enabled
  value: false

# Content blocking: Firefox answers cookie banners (refusing), and strips tracking from links,
# beside uBlock Origin's filters.
- name: cookiebanners.service.mode
  value: 1

- name: cookiebanners.service.mode.privateBrowsing
  value: 1

- name: privacy.query_stripping.enabled
  value: true

- name: privacy.query_stripping.enabled.pbmode
  value: true
