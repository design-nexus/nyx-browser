// Sets defaults and loads the chrome layer from <install>/nyx into each browser window.
(() => {
  try {
    // setup-runtime.sh writes the release the layer was tested on. On any other release the
    // browser still opens and stays secure: vertical tabs with the theme, and no overrides of
    // Zen's internals, so a visual break can never hold back a security update.
    const TESTED = "@TESTED_VERSION@";
    const tested = Services.appinfo.version === TESTED;

    defaultPref("zen.view.use-single-toolbar", false);
    defaultPref("zen.theme.content-element-separation", 6);
    defaultPref("zen.theme.border-radius", 11);
    defaultPref("zen.welcome-screen.seen", true);
    defaultPref("zen.watermark.enabled", false);
    defaultPref("browser.shell.checkDefaultBrowser", false);
    defaultPref("app.update.enabled", false);
    defaultPref("nyx.sidebar.mode", "auto");
    defaultPref("nyx.effects.frosted", false);
    // The top bar's buttons, as the mockup has them.
    defaultPref("zen.theme.hide-unified-extensions-button", false);
    defaultPref("zen.view.overflow-webext-toolbar", false);
    defaultPref("zen.view.experimental-no-window-controls", true);
    defaultPref("browser.download.autohideButton", false);
    // Zen's Library would replace Firefox's downloads panel, and doesn't fit the theme.
    defaultPref("zen.library.enabled", false);
    defaultPref("browser.shareqrcode.enabled", true);
    // Zen's "Update Complete" card: this browser updates only through upstream.toml.
    defaultPref("zen.updates.show-update-notification", false);
    if (!tested) {
      lockPref("zen.tabs.vertical", true);
    }

    const install = Services.dirsvc.get("GreD", Ci.nsIFile);
    install.append("nyx");
    const state = Services.env.get("XDG_STATE_HOME") || `${Services.env.get("HOME")}/.local/state`;
    const stateDir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    stateDir.initWithPath(`${state}/nyx-browser`);
    const resources = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
    resources.setSubstitution("nyx", Services.io.newFileURI(install));
    resources.setSubstitution("nyx-state", Services.io.newFileURI(stateDir));

    const sheets = tested ? ["theme.css", "layout.css", "horizontal.css"] : ["theme.css"];
    const scripts = tested ? ["addons.js", "orientation.js", "theme.js", "sidebar.js", "appearance.js", "actions.js", "toolbar.js", "sidebar-parts.js"] : ["addons.js", "theme.js"];

    Services.obs.addObserver(window => {
      if (window.location.href !== "chrome://browser/content/browser.xhtml") {
        return;
      }
      const utils = window.windowUtils;
      for (const sheet of sheets) {
        utils.loadSheetUsingURIString(`resource://nyx/${sheet}`, utils.AUTHOR_SHEET);
      }
      for (const script of scripts) {
        Services.scriptloader.loadSubScriptWithOptions(`resource://nyx/${script}`, { target: window, ignoreCache: true });
      }
    }, "browser-window-before-show");
  } catch (error) {
    Components.utils.reportError(error);
  }
})();
