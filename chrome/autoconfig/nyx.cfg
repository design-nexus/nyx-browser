// Loads the chrome layer from <install>/nyx into each browser window.
(() => {
  try {
    const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
    dir.append("nyx");
    Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("nyx", Services.io.newFileURI(dir));
    Services.obs.addObserver(window => {
      if (window.location.href !== "chrome://browser/content/browser.xhtml") {
        return;
      }
      window.windowUtils.loadSheetUsingURIString("resource://nyx/horizontal.css", window.windowUtils.AUTHOR_SHEET);
      Services.scriptloader.loadSubScriptWithOptions("resource://nyx/orientation.js", { target: window, ignoreCache: true });
    }, "browser-window-before-show");
  } catch (error) {
    Components.utils.reportError(error);
  }
})();
